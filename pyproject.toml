[project]
name = "fcrawl"
version = "0.1.0"
description = "A powerful CLI tool for Firecrawl - web scraping from your terminal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "beautifulsoup4>=4.14.3",
    "camoufox[geoip]>=0.4.11",
    "click>=8.3.1",
    "firecrawl-py",
    "httpx>=0.28.1",
    "idna>=3.4",
    "orjson>=3.11.5",
    "pyperclip>=1.11.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "rich>=14.2.0",
    "twscrape",
    "yt-dlp>=2025.12.8",
]

[project.optional-dependencies]
asr = [
    "funasr>=1.3.0",
    "torch>=2.9.0",
    "torchaudio>=2.9.0",
    "pydub>=0.25.1",
    "opencc>=1.1.9",
]

[project.scripts]
fcrawl = "fcrawl:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/fcrawl"]

[tool.uv.sources]
# Arthur's firecrawl fork: SDK with DocumentMetadata extra fields (gateway gw* metadata rides on them).
firecrawl-py = { git = "https://github.com/Yan-Yu-Lin/firecrawl.git", rev = "3c3212971830bc02dec4b89fe261de1c89c25383", subdirectory = "apps/python-sdk" }
# Arthur's twscrape fork (branch fcrawl): upstream main + structured error causes + opt-in telemetry.
twscrape = { git = "https://github.com/Yan-Yu-Lin/twscrape.git", rev = "ba55f98a6d7e23d3fc84cf3e71188d684fc86aee" }

[tool.uv]
# Override old deps to get Python 3.13 compatible versions
override-dependencies = [
    "numba>=0.60.0",
    "librosa>=0.10.0",
    "llvmlite>=0.43.0",
]
